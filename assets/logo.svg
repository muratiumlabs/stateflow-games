<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#9b51e0" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#b827fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Logo Icon: State / Flow dynamic gaming symbol -->
  <g transform="translate(10, 10)">
    <!-- Outer hexagon/shield flow -->
    <path d="M50 5 L88 27 L88 73 L50 95 L12 73 L12 27 Z" fill="none" stroke="url(#flowGrad)" stroke-width="4" filter="url(#glow)"/>
    <!-- Inner geometric flow arrows & gamepad core -->
    <path d="M50 20 L75 35 L75 65 L50 80 L25 65 L25 35 Z" fill="rgba(79, 172, 254, 0.12)" stroke="url(#flowGrad)" stroke-width="2.5"/>
    
    <!-- Gaming D-Pad & Flow nodes -->
    <circle cx="50" cy="50" r="10" fill="url(#neonGlow)" />
    <!-- Dynamic Flow Waves -->
    <path d="M36 50 L28 50 M64 50 L72 50 M50 36 L50 28 M50 64 L50 72" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
    <!-- Small accent dots -->
    <circle cx="38" cy="38" r="2.5" fill="#00f2fe" />
    <circle cx="62" cy="38" r="2.5" fill="#9b51e0" />
    <circle cx="38" cy="62" r="2.5" fill="#4facfe" />
    <circle cx="62" cy="62" r="2.5" fill="#00f2fe" />
  </g>

  <!-- Text: STATEFLOW GAMES -->
  <text x="125" y="58" font-family="'Plus Jakarta Sans', 'Outfit', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="3" fill="#ffffff">STATE<tspan fill="url(#flowGrad)">FLOW</tspan></text>
  <text x="127" y="86" font-family="'Plus Jakarta Sans', 'Outfit', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="8" fill="#94a3b8">G A M E S</text>
  
  <!-- Accent underline bar -->
  <rect x="127" y="96" width="90" height="3" rx="1.5" fill="url(#flowGrad)" />
</svg>
